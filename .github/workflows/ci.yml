#
# Build, test and scan. Actions are pinned to full commit SHAs (Dependabot keeps them current); the
# workflow token can only read.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # stdlib only: nothing to cache
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w ."; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: check-theme on examples/
        run: |
          set -euo pipefail
          for d in examples/*/; do go run . check-theme "$d"; done
      - name: pack-theme is reproducible and its archive checks
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/edge" .
          "$RUNNER_TEMP/edge" pack-theme -o "$RUNNER_TEMP/a.tgz" examples/minimal
          "$RUNNER_TEMP/edge" pack-theme -o "$RUNNER_TEMP/b.tgz" examples/minimal
          cmp "$RUNNER_TEMP/a.tgz" "$RUNNER_TEMP/b.tgz"
          "$RUNNER_TEMP/edge" check-theme "$RUNNER_TEMP/a.tgz#sha256:$(sha256sum "$RUNNER_TEMP/a.tgz" | cut -c1-64)"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (runs the tests and check-theme inside)
        run: docker build -t mosaicast-edge:ci .
      - name: Image starts and answers its healthcheck
        run: |
          set -euo pipefail
          docker run -d --name edge --read-only -e EDGE_UPSTREAM=http://127.0.0.1:9 -v edge-cache:/cache mosaicast-edge:ci
          for i in $(seq 1 20); do
            if docker exec edge /mosaicast-edge healthcheck; then exit 0; fi
            sleep 0.5
          done
          docker logs edge; exit 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the tip
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --exit-code 1
