#
# Set up once:  pipx install pre-commit && pre-commit install
# Before each commit: secrets scan (gitleaks) and the SPDX header check CI runs too.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: spdx-header
        name: SPDX header check
        language: system
        files: \.(go|js|mjs|css|html|sh|ya?ml)$|^Dockerfile$|^dev/
        exclude: (^|/)(node_modules|tmp)/
        entry: bash -c 'for f in "$@"; do head -n 15 "$f" | grep -q "SPDX-License-Identifier:" && head -n 15 "$f" | grep -q "SPDX-FileCopyrightText:" || { echo "Missing SPDX header: $f"; exit 1; }; done' --
